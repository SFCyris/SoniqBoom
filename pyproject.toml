[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soniqboom"
version = "1.14.5"
description = "Self-hosted music server for personal libraries — FLAC, MP3, Opus, SID, MIDI, plus 20+ tracker formats"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "S.F. Cyris" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "fastapi>=0.110.0",
    "starlette>=1.3.1",   # FastAPI's ASGI toolkit, also used directly — security fixes
    "uvicorn[standard]>=0.27.0",
    "mutagen>=1.47.0",
    "lhafile>=0.3.1",   # Amiga LHA/LZH archive reading (scan inside .lha)
    "aiofiles>=23.2.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "httpx>=0.27.0",
    "Pillow>=12.3.0",
    "mido>=1.3.0",
    # SMB shares.  1.13.0 is the smbprotocol LIBRARY's minimum version, not
    # SoniqBoom's — leave it alone when bumping SoniqBoom's version.
    "smbprotocol>=1.13.0",
    "cryptography>=50.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.2.2",
    "websockets>=11.0",
    "watchdog>=4.0.0",
    "defusedxml>=0.7.1",
    "anyio>=4.14.2",       # async I/O helpers (internet-radio relay)
    "orjson>=3.11.6",    # fast JSON serialization for the large track/search list pages
]

[project.urls]
Homepage      = "https://github.com/SFCyris/SoniqBoom"
Source        = "https://github.com/SFCyris/SoniqBoom"
Issues        = "https://github.com/SFCyris/SoniqBoom/issues"
Documentation = "https://github.com/SFCyris/SoniqBoom/blob/main/docs/manual/index.html"
Changelog     = "https://github.com/SFCyris/SoniqBoom/releases"

[project.optional-dependencies]
dev   = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3"]
macos = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-WebKit>=10.0",
]

[project.scripts]
soniqboom        = "soniqboom.main:cli"
soniqboom-setadm = "soniqboom.cli_setadm:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soniqboom*"]

[tool.setuptools.package-data]
"soniqboom" = ["frontend/**/*", "data/**/*"]
