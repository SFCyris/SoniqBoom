# SoniqBoom behind Caddy with automatic HTTPS (Let's Encrypt).
#
#   1. Point your domain's DNS at this host; open ports 80 and 443.
#   2. Edit deploy/Caddyfile — replace music.example.com with your domain.
#   3. From the repo root:
#        docker compose -p soniqboom -f deploy/docker-compose.https.yml up -d
#      -p must be the project name of the plain docker-compose.yml setup so both
#      use the same data volume: the part before _soniqboom-data in
#      `docker volume ls` (soniqboom for a git clone, soniqboom-main for the
#      ZIP).  Use the same -p and -f on every docker compose command, and stop
#      the plain setup first (both name their container soniqboom).
#   4. Open https://your-domain — Caddy fetches the certificate on first request.
#
# SoniqBoom itself is NOT published on the host here; only Caddy is exposed, so
# the only way in is through TLS.

services:
  soniqboom:
    build: ..
    # image: ghcr.io/sfcyris/soniqboom:latest
    container_name: soniqboom
    volumes:
      - ../music:/music:ro
      - soniqboom-data:/data
    environment:
      - SONIQBOOM_DATA_DIR=/data
    restart: unless-stopped
    expose:
      - "8080"            # reachable only on the internal compose network

  caddy:
    image: caddy:2-alpine
    container_name: soniqboom-caddy
    depends_on:
      - soniqboom
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  soniqboom-data:
  caddy-data:
  caddy-config:
