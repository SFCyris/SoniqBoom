# SoniqBoom — simplest self-host. `docker compose up -d`, then open :8080.
#
#   1. Put (or symlink) your music under ./music — or edit the bind below.
#   2. docker compose up -d
#   3. Open http://<host>:8080, create the first admin (see DEPLOY.md),
#      then under gear → Library → Music Folders add  /music  as a library folder.
#
# For automatic HTTPS over the internet, see deploy/docker-compose.https.yml.

services:
  soniqboom:
    build: .
    # ── Skip the local build — use the prebuilt multi-arch image instead: ──
    #   comment out `build: .` above, uncomment the line below, then
    #   `docker compose pull && docker compose up -d`
    # image: ghcr.io/sfcyris/soniqboom:latest
    container_name: soniqboom
    ports:
      - "8080:8080"
    volumes:
      - ./music:/music:ro       # your library — read-only (drop :ro to let SoniqBoom edit tags / save lyrics)
      - soniqboom-data:/data    # index, users, settings, caches, SoundFonts, logs (back this up)
    environment:
      - SONIQBOOM_DATA_DIR=/data
      # A new deployment's first start switches on the online collections and
      # downloads the scene information (both "yes" when not set): set "no", or
      # a list such as hvsc,aminet / hvsc,demozoo.  Later: soniqboom collections add
      # - SONIQBOOM_COLLECTIONS=yes     # modland, hvsc, aminet, sceneorg
      #                                 # (the Modland catalogue needs about 1 GB more memory)
      # - SONIQBOOM_SCENE_INFO=yes      # hvsc, modland, songdb, demozoo
      # - TZ=Europe/Berlin
    restart: unless-stopped

volumes:
  soniqboom-data:
